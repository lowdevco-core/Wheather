<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modern weather app with real-time forecasts, air quality, UV index, and more." />
  <title>Weather App</title>
  <link rel="icon" href="./assets/resources/icon/weather-code/cloudy.png" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
  <!-- Ambient background glow blobs -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- Toast container for notifications -->
  <div id="toast-container" class="toast-container"></div>

  <div class="app-shell">
    <!-- Hero + Search row -->
    <div class="top-row">
      <!-- Current weather card -->
      <section class="weather-hero">
        <div class="hero-left">
          <img src="./assets/resources/icon/weather-code/sunny.png" alt="Current weather"
            class="hero-icon weather-update-field" />
          <div class="hero-info">
            <h1 id="temprature" class="hero-temp">—</h1>
            <h2 id="place" class="hero-place">—</h2>
            <p class="hero-condition weather-update-field">—</p>
          </div>
        </div>
        <div class="hero-right">
          <span id="Windspeed" class="hero-stat">Wind: —</span>
          <span id="Humidity" class="hero-stat">Humidity: —</span>
        </div>
      </section>

      <!-- Search panel -->
      <aside class="search-panel">
        <div class="search-bar">
          <!-- Premium search SVG icon -->
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="user-input" type="text" placeholder="Search city…" />
          <button id="input-submit-btn" class="search-btn" type="submit">
            Search
          </button>
        </div>
        <div class="suggestions" id="place-suggestion"></div>
      </aside>
    </div>

    <!-- Metrics tiles -->
    <section class="metrics-grid">
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/day.png" alt="Date" />
        <span class="metric-label">Date</span>
        <span class="metric-value">—</span>
      </div>
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/air.png" alt="Air quality" />
        <span class="metric-label">Air</span>
        <span class="metric-value">—</span>
      </div>
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/moisturizer.png" alt="Moisture" />
        <span class="metric-label">Moisture</span>
        <span class="metric-value">—</span>
      </div>
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/wawes.png" alt="Wave height" />
        <span class="metric-label">Wave</span>
        <span class="metric-value">—</span>
      </div>
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/uv-light.png" alt="UV index" />
        <span class="metric-label">UV</span>
        <span class="metric-value">—</span>
      </div>
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/wind.png" alt="Wind speed" />
        <span class="metric-label">Wind</span>
        <span class="metric-value">—</span>
      </div>
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/pressure.png" alt="Pressure" />
        <span class="metric-label">Pressure</span>
        <span class="metric-value">—</span>
      </div>
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/visiblity.png" alt="Visibility" />
        <span class="metric-label">Visibility</span>
        <span class="metric-value">—</span>
      </div>
      <div class="metric-tile">
        <img src="./assets/resources/icon/fixed-icons/weather.png" alt="Weather" />
        <span class="metric-label">Weather</span>
        <span class="metric-value">—</span>
      </div>
    </section>
  </div>

  <script src="./assets/java-script/script.js"></script>
</body>

</html>
